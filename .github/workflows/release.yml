name: Release Package

# Publishes two packages to PyPI when a GitHub release is published:
#   jenkinsfilelint-engine  prebuilt wheels of the offline engine (Rust)
#   jenkinsfilelint         the pure-Python package, which pins the engine
# The engine goes first, so jenkinsfilelint never points at an engine version
# that is not on PyPI yet. Pull requests and manual runs build and test both
# without publishing.

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATURIN_VERSION: v1.15.0

jobs:
  engine-wheels:
    name: Engine wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto}
          - {runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: auto}
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {runner: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {runner: macos-latest, target: x86_64-apple-darwin}
          - {runner: macos-latest, target: aarch64-apple-darwin}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Build wheel
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
      with:
        maturin-version: ${{ env.MATURIN_VERSION }}
        working-directory: crates/jenkinsfilelint
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux || 'auto' }}
        args: --release --out dist
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: engine-wheel-${{ matrix.target }}
        path: crates/jenkinsfilelint/dist/*.whl
        if-no-files-found: error

  engine-sdist:
    name: Engine sdist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Build sdist
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
      with:
        maturin-version: ${{ env.MATURIN_VERSION }}
        working-directory: crates/jenkinsfilelint
        command: sdist
        args: --out dist
    - name: Install from sdist (builds with Rust)
      run: |
        python3 -m venv /tmp/venv
        /tmp/venv/bin/pip install crates/jenkinsfilelint/dist/*.tar.gz
        /tmp/venv/bin/jenkinsfilelint-engine --version
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: engine-sdist
        path: crates/jenkinsfilelint/dist/*.tar.gz
        if-no-files-found: error

  python-dist:
    name: jenkinsfilelint sdist and wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # needed for setuptools_scm to derive version from git tags
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
    - name: Check the engine pin
      shell: python
      run: |
        import pathlib, re
        cargo = pathlib.Path("crates/jenkinsfilelint/Cargo.toml").read_text()
        pyproject = pathlib.Path("pyproject.toml").read_text()
        version = re.search(r'^version = "([^"]+)"', cargo, re.M).group(1)
        pin = re.search(r"jenkinsfilelint-engine==([^;\s\"]+)", pyproject).group(1)
        assert pin == version, f"pyproject.toml pins jenkinsfilelint-engine=={pin}, Cargo.toml says {version}"
        print(f"jenkinsfilelint-engine=={pin}")
    - name: Install build tools
      run: python -m pip install --upgrade pip build twine
    - name: Build distribution
      run: python -m build
    - name: Check distribution
      run: twine check dist/*
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: python-dist
        path: dist/
        if-no-files-found: error

  test:
    # Install the exact files that will be published, on the platform each
    # wheel is for, and run jenkinsfilelint --offline. No Rust is involved:
    # --only-binary refuses to build the engine from source.
    name: Test ${{ matrix.target }}
    needs: [engine-wheels, python-dist]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-musl, alpine: true}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, alpine: true}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: macos-latest, target: aarch64-apple-darwin}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: tests
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: engine-wheel-${{ matrix.target }}
        path: wheels/engine
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: python-dist
        path: wheels/python
    - name: Write the test script
      run: |
        cat > smoke-test.sh <<'EOF'
        set -eux
        python -m pip install --only-binary jenkinsfilelint-engine wheels/engine/*.whl
        python -m pip install --only-binary jenkinsfilelint-engine wheels/python/*.whl
        jenkinsfilelint-engine --version
        jenkinsfilelint --offline --verbose tests/Jenkinsfile
        if jenkinsfilelint --offline tests/Jenkinsfile.fail; then
          echo "tests/Jenkinsfile.fail should fail"
          exit 1
        fi
        EOF
    - name: Set up Python
      if: ${{ !matrix.alpine }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
    - name: Test
      if: ${{ !matrix.alpine }}
      run: bash smoke-test.sh
    - name: Test in Alpine Linux
      if: ${{ matrix.alpine }}
      run: >
        docker run --rm -v "$PWD:/work" -w /work -e PIP_ROOT_USER_ACTION=ignore
        python:3-alpine sh -c 'apk add --no-cache bash && bash smoke-test.sh'

  publish-engine:
    name: Publish jenkinsfilelint-engine
    needs: [test, engine-sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jenkinsfilelint-engine
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: engine-*
        path: dist
        merge-multiple: true
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        # The engine has its own version, so most releases re-upload files
        # that are already on PyPI. Bump it in Cargo.toml when it changes.
        skip-existing: true

  publish:
    name: Publish jenkinsfilelint
    needs: [publish-engine]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jenkinsfilelint
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: python-dist
        path: dist
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
