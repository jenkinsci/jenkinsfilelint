name: PR Auto-labeler

on:
  # Labels from the title and branch only: nothing of the pull request is checked out.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-label:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Uses local .github/release-drafter.yml autolabeler config by default.
        # No config-name needed — it auto-discovers the config in this repo.
