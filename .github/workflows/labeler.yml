name: PR Auto-labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-label:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Uses local .github/release-drafter.yml autolabeler config by default.
        # No config-name needed — it auto-discovers the config in this repo.
