name: Rust

on:
  push:
    branches: [ main ]
    paths: [ 'crates/**', '.github/workflows/rust.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'crates/**', '.github/workflows/rust.yml' ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: crates/jenkinsfilelint
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal --component clippy,rustfmt
        rustup default stable

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Unit tests
      run: cargo test

    - name: Build release binary
      run: cargo build --release

    - name: Compare with the official validator's test files
      if: matrix.os == 'ubuntu-latest'
      run: python3 scripts/corpus_check.py
