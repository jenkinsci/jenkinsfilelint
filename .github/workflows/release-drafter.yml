name: Release Drafter

on:
  push:
    branches:
      - "main"
  # allowing to run manually
  workflow_dispatch:

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      # Required to create/update the release
      contents: write
      # Required for autolabeler to add labels to PRs
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        # Uses local .github/release-drafter.yml with version-resolver
        # entries for semver bumping based on PR labels.
