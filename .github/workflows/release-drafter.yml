name: Release Drafter

on:
  push:
    branches:
      - "main"
  # allowing to run manually
  workflow_dispatch:

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      # Required to create/update the release
      contents: write
      # Required for autolabeler to add labels to PRs
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        # Uses local .github/release-drafter.yml with version-resolver
        # entries for semver bumping based on PR labels.
