name: Release Drafter

on:
  push:
    branches:
      - "main"
  # allowing to run manually
  workflow_dispatch:

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      # Required to create/update the release
      contents: write
      # Required for autolabeler to add labels to PRs
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        # Uses local .github/release-drafter.yml with version-resolver
        # entries for semver bumping based on PR labels.
