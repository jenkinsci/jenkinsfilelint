name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal --component clippy,rustfmt
        rustup default stable

    - name: Check formatting
      working-directory: crates/jenkins-lint
      run: cargo fmt --check

    - name: Clippy
      working-directory: crates/jenkins-lint
      run: cargo clippy --all-targets -- -D warnings

    - name: Tests
      # Unit tests, and tests/cli.rs, which runs the jenkins-lint binary.
      working-directory: crates/jenkins-lint
      run: cargo test

    - name: Compare with the official validator's test files
      if: matrix.os == 'ubuntu-latest'
      working-directory: crates/jenkins-lint
      run: |
        cargo build --release
        python3 scripts/corpus_check.py

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.x"

    - name: Python tests and pre-commit hooks
      run: |
        python -m pip install --upgrade pip pytest pre-commit
        pytest tests/ -m "not docker"
        pre-commit run --all-files

  integration-docker:
    runs-on: ubuntu-latest
    # These tests start a real Jenkins container, so they only run on Linux
    # where GitHub Actions has Docker.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build jenkins-lint
        working-directory: crates/jenkins-lint
        run: cargo build

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"

      - name: Run Docker integration tests
        # Builds docker/ and checks against that Jenkins (tests/jenkins_server.py).
        run: |
          python -m pip install pytest
          pytest tests/test_docker_linter.py -v -m docker
