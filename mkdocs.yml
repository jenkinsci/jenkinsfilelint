site_name: jenkins-lint
site_description: Catch Jenkinsfile mistakes and security problems before they reach your CI.
site_url: https://jenkinsci.github.io/jenkins-lint/
repo_url: https://github.com/jenkinsci/jenkins-lint
repo_name: jenkinsci/jenkins-lint
edit_uri: edit/main/docs/
docs_dir: docs
copyright: >-
  Jenkins logo from the <a href="https://www.jenkins.io/artwork/">Jenkins artwork</a>,
  <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>.
exclude_docs: |
  requirements.txt
  theme/

theme:
  name: sumi
  custom_dir: docs/theme
  logo: assets/jenkins.svg
  favicon: assets/jenkins.svg
  navigation_tabs: false
  hide: [breadcrumbs, actions]
  credit: false

extra_css:
  - assets/site.css

hooks:
  - docs/theme/hooks.py

plugins:
  - search
  - llms_txt
  - sumi

nav:
  - Dashboard: index.md
  - Install: install.md
  - Usage: usage.md
  - Pre-commit hook: pre-commit.md
  - Configuration: configuration.md
  - Security: security.md
  - How it works: how-it-works.md
  - Migrating to 2.0: migrating.md
  - Security rules:
      - rules/README.md
      - script-injection: rules/script-injection.md
      - secret-interpolation: rules/secret-interpolation.md
      - controller-execution: rules/controller-execution.md
      - unpinned-library: rules/unpinned-library.md
      - unpinned-image: rules/unpinned-image.md
      - unrestricted-input: rules/unrestricted-input.md
