# Only for pre-commit, which installs a hook's repository from source: this
# package has no code of its own and is not published. It depends on the
# jenkins-lint wheel on PyPI, built from crates/jenkins-lint, so that
# pre-commit users never need a Rust toolchain (ruff does the same with its
# ruff-pre-commit repository).
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkins-lint-pre-commit"
# The version of crates/jenkins-lint/Cargo.toml, and the pin below with it.
# crates/jenkins-lint/scripts/check_version.py checks that they agree.
version = "2.1.0"
description = "pre-commit hooks of jenkins-lint"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["jenkins-lint==2.1.0"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "docker: integration tests against a real Jenkins container (requires Docker)",
]
