ci:
  skip: [jenkins-lint]

# Test Jenkinsfiles of the offline linter: kept byte for byte, and many are
# invalid on purpose.
exclude: ^crates/jenkinsfilelint/tests/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/shenxianpeng/hadolint-pre-commit
    rev: v2.14.0.1
    hooks:
      - id: hadolint
  - repo: local
    # This is a "local" hook to run jenkins-lint
    hooks:
      - id: jenkins-lint
        name: jenkins-lint
        description: Lint Jenkinsfiles and Groovy files.
        entry: jenkins-lint
        language: python
        additional_dependencies: ['requests']
        files: (?i)^(.*/)?(Jenkinsfile[^/]*|.*\.groovy)$
        exclude: ^jenkins_lint/
        pass_filenames: true
        verbose: true
        stages: [manual]  # pre-commit run jenkins-lint --all-files --hook-stage manual
