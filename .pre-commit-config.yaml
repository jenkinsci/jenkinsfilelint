ci:
  skip: [jenkins-lint]

# Test Jenkinsfiles of the offline linter: kept byte for byte, and many are
# invalid on purpose.
exclude: ^crates/jenkins-lint/tests/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/shenxianpeng/hadolint-pre-commit
    rev: v2.14.0.1
    hooks:
      - id: hadolint
  - repo: local
    # jenkins-lint of this checkout, on the repository's own Jenkinsfiles.
    hooks:
      - id: jenkins-lint
        name: jenkins-lint
        description: Lint Jenkinsfiles and Groovy files.
        entry: cargo run --quiet --manifest-path crates/jenkins-lint/Cargo.toml --
        language: system
        files: (?i)^(.*/)?(Jenkinsfile[^/]*|.*\.groovy)$
        pass_filenames: true
        verbose: true
        stages: [manual]  # pre-commit run jenkins-lint --all-files --hook-stage manual
