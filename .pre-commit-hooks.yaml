- id: jenkins-lint
  name: jenkins-lint
  description: Check Jenkinsfile syntax and Declarative Pipeline structure offline. Add --remote to also check with your Jenkins.
  entry: jenkins-lint
  language: python
  types: [file]
  files: ^.*(Jenkinsfile.*|.*\.groovy)$
  require_serial: true
- id: jenkins-lint-offline
  name: jenkins-lint (offline)
  description: Same as the jenkins-lint hook, which checks offline since 2.0.
  entry: jenkins-lint
  language: python
  types: [file]
  files: ^.*(Jenkinsfile.*|.*\.groovy)$
  require_serial: true
- id: jenkins-lint-audit
  name: jenkins-lint (audit)
  description: Same as the jenkins-lint hook, which runs the security checks too since 2.0.
  entry: jenkins-lint
  language: python
  types: [file]
  files: ^.*(Jenkinsfile.*|.*\.groovy)$
  require_serial: true
# The hook ids from before the project was renamed from jenkinsfilelint, so
# that `pre-commit autoupdate` does not break existing configurations.
- id: jenkinsfilelint
  name: jenkins-lint
  description: Old id of the jenkins-lint hook.
  entry: jenkins-lint
  language: python
  types: [file]
  files: ^.*(Jenkinsfile.*|.*\.groovy)$
  require_serial: true
- id: jenkinsfilelint-offline
  name: jenkins-lint (offline)
  description: Old id of the jenkins-lint-offline hook.
  entry: jenkins-lint
  language: python
  types: [file]
  files: ^.*(Jenkinsfile.*|.*\.groovy)$
  require_serial: true
- id: jenkinsfilelint-audit
  name: jenkins-lint (audit)
  description: Old id of the jenkins-lint-audit hook.
  entry: jenkins-lint
  language: python
  types: [file]
  files: ^.*(Jenkinsfile.*|.*\.groovy)$
  require_serial: true
